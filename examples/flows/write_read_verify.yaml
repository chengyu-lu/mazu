# Example flow: write a pattern, flush, read it back and verify.
# Contains a destructive op (write), so allow_destructive must be true.
version: 1
name: write_read_verify
description: Basic write/read data-integrity smoke test.
allow_destructive: true

steps:
  - name: write pattern 0xA5
    op: write
    params: { lba: 100, blocks: 8, pattern: 0xA5 }

  - name: flush
    op: flush

  - name: read back
    op: read
    params: { lba: 100, blocks: 8 }
    assert:
      - { path: all_zero, op: eq, value: false }
      - { path: first_16_hex, op: eq, value: "a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5" }

  - name: read untouched region stays zero
    op: read
    params: { lba: 0, blocks: 1 }
    assert:
      - { path: all_zero, op: eq, value: true }
