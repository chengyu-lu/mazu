[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazu"
version = "0.1.0"
description = "AI-assisted storage validation and debugging framework for SSD/controller firmware engineers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mazu = "mazu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hardware tests (tests/hw/, Phase 2+) are opt-in: `pytest -m hw`.
# The default run must stay green on any machine with no device attached.
addopts = "-m 'not hw'"
markers = [
    "hw: requires real storage hardware (excluded by default)",
]
